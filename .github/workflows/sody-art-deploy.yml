name: Publish approved SODY artwork
on:
  push:
    paths:
      - '.github/workflows/sody-art-deploy.yml'
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved transparent artwork
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL --retry 3 --connect-timeout 12 --max-time 55 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JSxcOirL4mYOchZOe1eqkneCaW/8caaaeba-6357-4eec-9b01-9192f62e174d.webp' -o assets/sody-bottle.webp
          curl -fL --retry 3 --connect-timeout 12 --max-time 55 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JSxcOirL4mYOchZOe1eqkneCaW/0830ee4d-ea47-4de7-addc-429b4e108462.webp' -o assets/sody-molecular-woman.webp
          file assets/sody-bottle.webp assets/sody-molecular-woman.webp
          test $(stat -c%s assets/sody-bottle.webp) -gt 5000
          test $(stat -c%s assets/sody-molecular-woman.webp) -gt 7000
      - name: Commit approved artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sody-bottle.webp assets/sody-molecular-woman.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Restore approved transparent SODY visuals'
            git push
          fi
