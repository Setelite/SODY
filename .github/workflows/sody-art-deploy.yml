name: Build editable SODY artwork layers
on:
  push:
    paths:
      - 'tools/build_sody_cutouts.py'
      - '.github/workflows/sody-art-deploy.yml'
permissions:
  contents: write
jobs:
  cutouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract approved bottle and molecule figure into transparent layers
        run: |
          python -m pip install --quiet Pillow numpy opencv-python-headless
          python tools/build_sody_cutouts.py
      - name: Publish image layers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sody-bottle-cut.webp assets/sody-woman-cut.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Publish independent SODY bottle and woman artwork layers'
            git push
          fi
