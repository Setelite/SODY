name: Deploy SODY to Timeweb (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sody-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check SSH secrets
        env:
          DEPLOY_KEY: ${{ secrets.SODY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SODY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "::error::Missing SODY_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "::error::Missing SODY_SSH_KNOWN_HOSTS"; exit 1; }

      - name: Configure SSH securely
        env:
          DEPLOY_KEY: ${{ secrets.SODY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SODY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sody_deploy_key
          chmod 600 ~/.ssh/sody_deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/sody_deploy_key > /dev/null

      - name: Check remote SODY directory and rsync
        run: |
          ssh -i ~/.ssh/sody_deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p 22 cx74614@vh454.timeweb.ru \
            'test -d /home/c/cx74614/public_html/sody && command -v rsync >/dev/null'

      - name: Deploy only the SODY application
        run: |
          rsync -rltvz \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='README.txt' \
            --exclude='node_modules/' \
            -e 'ssh -i ~/.ssh/sody_deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p 22' \
            ./ cx74614@vh454.timeweb.ru:/home/c/cx74614/public_html/sody/

      - name: Diagnose and verify published SODY version
        run: |
          set -euo pipefail
          echo "Expected git SHA: ${GITHUB_SHA}"
          echo "Local HTML sha256:"
          sha256sum index.html
          echo "Remote HTML sha256:"
          ssh -i ~/.ssh/sody_deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p 22 cx74614@vh454.timeweb.ru \
            'sha256sum /home/c/cx74614/public_html/sody/index.html; grep -o "SODY / FOREST EDITION" /home/c/cx74614/public_html/sody/index.html | head -1 || true'
          echo "Checking public response..."
          curl -LsS --retry 2 --connect-timeout 8 --max-time 20 \
            -H 'Cache-Control: no-cache' \
            -D /tmp/sody-headers \
            -o /tmp/sody-live.html \
            -w 'HTTP %{http_code}; final_url %{url_effective}; bytes %{size_download}\n' \
            "https://gornostaevmarketing.ru/sody/index.html?deployment=${GITHUB_SHA}"
          echo "Response headers (non-sensitive):"
          grep -iE '^(HTTP/|content-type:|cache-control:|age:|server:|location:|etag:|last-modified:|x-cache:)' /tmp/sody-headers || true
          echo "Live HTML sha256:"
          sha256sum /tmp/sody-live.html
          if grep -Fq 'SODY / FOREST EDITION' /tmp/sody-live.html; then
            echo "Verified: SODY Forest Edition is live"
          else
            echo "::error::Public SODY does not match the latest version; compare the hashes and HTTP status above"
            exit 1
          fi
